<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xtino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-primary:#15130F;
    --bg-panel:#201D17;
    --bg-panel-alt:#2A2620;
    --text-primary:#F2EFE9;
    --text-muted:#a39c8e;
    --accent-lift:#C1441F;
    --accent-lift-dim:#7a2c14;
    --accent-run:#3FAF8B;
    --accent-run-dim:#245a49;
    --border:#3A352C;
    --border-soft:#2A261F;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg-primary);
    color:var(--text-primary);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:32px 16px;
  }
  .wrap{max-width:520px; width:100%; text-align:center;}
  .eyebrow{
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.2em;
    color:var(--text-muted); text-transform:uppercase; margin-bottom:10px;
  }
  h1{
    font-family:'Oswald',sans-serif; font-weight:600; font-size:44px;
    letter-spacing:0.01em; text-transform:uppercase; margin-bottom:10px;
  }
  h1 span{color:var(--accent-run);}
  .subtitle{color:var(--text-muted); font-size:14px; margin-bottom:38px;}

  .cards{display:flex; flex-direction:column; gap:14px;}
  .card{
    display:flex; align-items:center; gap:16px; text-align:left;
    background:var(--bg-panel); border:1px solid var(--border-soft); border-radius:12px;
    padding:20px 22px; text-decoration:none; color:var(--text-primary);
    transition:all .15s ease;
  }
  .card:hover{border-color:var(--accent-run); transform:translateY(-1px);}
  .card .icon{
    width:44px; height:44px; border-radius:10px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:20px;
  }
  .card.training .icon{background:var(--accent-lift-dim); color:var(--accent-lift);}
  .card.macros .icon{background:var(--accent-run-dim); color:var(--accent-run);}
  .card .label{
    font-family:'Oswald',sans-serif; font-size:19px; text-transform:uppercase; letter-spacing:0.01em;
  }
  .card .desc{color:var(--text-muted); font-size:12.5px; margin-top:3px;}
  .card .arrow{margin-left:auto; color:var(--text-muted); font-size:18px; flex-shrink:0;}
  .card:hover .arrow{color:var(--accent-run);}

  footer{
    margin-top:36px; color:var(--text-muted); font-size:11px;
    font-family:'JetBrains Mono',monospace; letter-spacing:0.04em;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Body Recomp &amp; 5K Program</div>
  <h1>X<span>tino</span></h1>
  <div class="subtitle">Pick a dashboard to open.</div>

  <div class="cards">
    <a class="card training" href="training.html">
      <div class="icon">🏋️</div>
      <div>
        <div class="label">Training</div>
        <div class="desc">Lift + run sessions, checkable sets, weekly progress</div>
      </div>
      <div class="arrow">→</div>
    </a>

    <a class="card macros" href="macros.html">
      <div class="icon">🍽️</div>
      <div>
        <div class="label">Macros</div>
        <div class="desc">Daily meals, macros vs targets, weekly summary</div>
      </div>
      <div class="arrow">→</div>
    </a>
  </div>

  <footer>Saves automatically on this device.</footer>
</div>
</body>
</html>
